name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Ubuntu runners restrict unprivileged user namespaces, so run as real
      # root; tests only write under their own temp dirs.
      - name: Run tests
        run: sudo env "PATH=$PATH" tests/run.sh
